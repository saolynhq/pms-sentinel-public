version: 2

updates:
  # Keeps SHA-pinned actions current. Without this, pinning actions to a commit
  # SHA (IMPLEMENTATION.md step 3) would freeze them at whatever was current on
  # pinning day — trading a supply-chain risk for a staleness one.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    ignore:
      # Dependabot's github-actions updater treats our reusable-workflow
      # reference as a dependency and tries to fetch https://github.com/saolynhq/.github.
      # That repo is PRIVATE and Dependabot has no access, so the fetch fails
      # (git_dependencies_not_reachable) and the whole actions update job aborts
      # — taking the legitimate third-party action bumps down with it.
      #
      # Ignoring it costs nothing: we deliberately hold this reference on @main
      # (see the security.yml suppression), so there is no version for Dependabot
      # to bump. Pinning it is a manual phase-3 action.
      - dependency-name: "saolynhq/.github/*"
    # A compromised action reaches CI with our secrets, so the cooldown matters
    # here at least as much as it does for application dependencies. It was
    # missing entirely until zizmor's dependabot-cooldown audit flagged it.
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    # Dependency cooldown. This is Dependabot's side of the same control as
    # .npmrc's min-release-age — without it, Dependabot would happily open a PR
    # for a version published an hour ago and the .npmrc setting would be the
    # only thing standing between us and it.
    # VERIFY this block against current Dependabot docs on first run; if the key
    # is rejected the whole file is ignored, which fails silently.
    # Lockfile-only: bump the resolved version in the lockfile, never rewrite
    # the declared range in pyproject.toml / package.json. Without this,
    # Dependabot "helpfully" widened constraints on first run — proposing
    # mypy >=1.13 -> >=2.3.0 and ruff >=0.8 -> >=0.16.2, i.e. major-version
    # jumps to tooling, as six separate PRs each firing two workflows.
    # Security updates still come through regardless of this setting.
    # VERIFY: supported for npm and pip; confirm for the `uv` ecosystem.
    versioning-strategy: "lockfile-only"
    # A first run against a stale tree should not open twenty PRs.
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
