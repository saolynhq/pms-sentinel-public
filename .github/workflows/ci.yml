name: CI

# This repo had no CI at all. It is a deployed Cloudflare site and until now
# nothing verified that a commit even builds.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # zizmor[artipacked]: checkout leaves the job token in
          # .git/config, where an artifact upload or a later step can
          # exfiltrate it. No step here pushes, so credentials are not
          # needed after clone.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install dependencies
        # --ignore-scripts blocks dependency lifecycle scripts (preinstall,
        # postinstall), which is where ChainDrop and most npm worms execute.
        # If this breaks the build, do not remove the flag — find out which
        # package needs a script and allowlist it deliberately.
        run: npm ci --ignore-scripts

      # NO TYPECHECK STEP, deliberately. package.json declares a `check` script
      # (`astro check`) but the repo has neither `@astrojs/check` nor
      # `typescript` as a devDependency, so the script cannot run — it would try
      # to install them at runtime and fail in CI. Adding those two devDeps and
      # enabling the step is a small follow-up worth doing; shipping a step that
      # fails on its first run is not.

      - name: Build (Astro)
        run: npm run build
